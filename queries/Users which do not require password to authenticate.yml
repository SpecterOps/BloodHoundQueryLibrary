name: Users which do not require password to authenticate
guid: 23bdc2ad-6739-4b2b-85d3-258e3f424eb2
prebuilt: true
platforms: Active Directory
category: Active Directory Hygiene
description: 
query: |-
  MATCH (u:User)
  WHERE u.passwordnotreqd = true
  AND u.enabled = true
  // Exclude interdomain trust accounts via UAC bit (0x0800 = 2048)
  AND NOT u.useraccountcontrol % 4096 < 2048  RETURN u
  LIMIT 100
revision: 2
