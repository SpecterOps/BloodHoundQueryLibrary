name: Computer owners who can obtain LAPS passwords
guid: 92aa81d6-b08e-4abb-ae39-ecbe5735a74c
prebuilt: false
platforms: Active Directory
category: Dangerous Privileges
description: Creators of computer objects get abusable rights on the computer object. If the owner is not explicitly granted ReadLAPSPassword other permissions they can still compromise the computer with the abusable owner rights.
query: |-
  MATCH (c:Computer)<-[:Owns|OwnsLimitedRights]-(n:User)
  WHERE c.haslaps = true
  AND c.enabled = true
  RETURN p
