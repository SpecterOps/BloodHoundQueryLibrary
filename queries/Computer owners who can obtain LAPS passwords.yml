name: Computer owners who can obtain LAPS passwords
guid: 92aa81d6-b08e-4abb-ae39-ecbe5735a74c
prebuilt: false
platforms: Active Directory
category: Dangerous Privileges
description: Owners of enabled LAPS-managed computers whose ownership rights allow reading LAPS passwords or modifying the DACL to grant that access.
query: |-
  MATCH p=(c:Computer)<-[r:Owns|OwnsLimitedRights]-(n:User)
  WHERE c.haslaps = true
  AND c.enabled = true
  AND (
    type(r) = 'Owns'
    OR ANY(privilege IN r.privileges WHERE privilege IN ['ReadLAPSPassword', 'AllExtendedRights', 'GenericAll', 'WriteDacl'])
  )
  RETURN p
revision: 2
