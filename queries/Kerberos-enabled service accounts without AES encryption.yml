name: Kerberos-enabled service accounts without AES encryption
guid: 8ff729ab-74e2-44a7-b02b-e9a81137c44b
prebuilt: false
platforms: Active Directory
category: Active Directory Hygiene
description: SPN accounts with an explicit supported encryption type configuration that excludes AES128 and AES256 ticket encryption. Unset and empty configurations are excluded because updated domain controllers default to AES under CVE-2026-20833 enforcement. Assumes default KDC settings and available AES keys; does not inspect effective KDC policy or key material.
query: |-
  MATCH (n:Base)
  WHERE n.hasspn = true
  AND ANY(encryption_type IN n.supportedencryptiontypes
    WHERE encryption_type <> 'Not defined')
  AND NONE(encryption_type IN n.supportedencryptiontypes WHERE encryption_type IN [
    'AES128-CTS-HMAC-SHA1-96',
    'AES256-CTS-HMAC-SHA1-96'
  ])
  RETURN n
  LIMIT 1000
revision: 1
resources:
- https://learn.microsoft.com/en-us/openspecs/windows_protocols/ms-kile/6cfc7b50-11ed-4b4d-846d-6f08f0812919
- https://support.microsoft.com/en-us/servicing/os/windows/2025/11/how-to-manage-kerberos-kdc-usage-of-rc4-for-service-account-ticket-issuance-changes-related-to-cve-2
