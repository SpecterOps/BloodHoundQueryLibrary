prebuilt: true
platforms: Active Directory
category: Shortest Paths
description: 
query: |-
  MATCH p=shortestPath((s)-[:AD_ATTACK_PATHS*1..]->(t:Base))
  WHERE (t:Tag_Tier_Zero)
  AND s<>t
  RETURN p
  LIMIT 1000
