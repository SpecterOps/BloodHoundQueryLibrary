name: Users with non-default Primary Group membership
guid: 93890f88-df2c-4167-a945-a53961d08d00
prebuilt: false
platforms: Active Directory
category: Active Directory Hygiene
description: 
query: |-
  MATCH p=(n:User)-[r:MemberOf]->(g:Group)
  WHERE r.isprimarygroup = true
  AND (
    (
      n.objectid ENDS WITH "-501" // User: Guest
      AND NOT g.objectid ENDS WITH "-514" // Group: Domain Guests
    )
    OR
    (
      NOT n.objectid ENDS WITH "-501" // Other users
      AND NOT g.objectid ENDS WITH "-513" // Group: Domain Users
    )
  )
  AND (n.gmsa IS NULL OR n.gmsa = false)
  AND (n.msa IS NULL OR n.msa = false)
  RETURN p
  LIMIT 1000
revision: 2
