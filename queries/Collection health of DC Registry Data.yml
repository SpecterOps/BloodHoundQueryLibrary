name: Collection health of DC Registry Data
guid: 3f0fa2f3-fbdf-42c0-9e7d-97e689009161
prebuilt: false
platforms: Active Directory
category: Domain Information
description: Returns active DCs with incomplete collection of certificate binding enforcement or the Netlogon security descriptor. DC registry data supports BloodHound's ADCS analysis and assessment of Netlogon secure channel exceptions. Collection requires Administrators membership on the DC by default. Requires SharpHound v2.3.5 or above for certificate binding enforcement; Netlogon collection requires SharpHound v2.8.0 or above and BloodHound v8.3.0 or above.
query: |-
  MATCH p=(:Domain)<-[:DCFor]-(c:Computer)
  WHERE (
    c.strongcertificatebindingenforcementraw IS NULL
    OR c.vulnerablenetlogonsecuritydescriptorcollected IS NULL
    OR c.vulnerablenetlogonsecuritydescriptorcollected = false
  )
  // Exclude inactive DCs
  AND c.enabled = true
  AND c.lastlogontimestamp > (datetime().epochseconds - (30 * 86400))
  RETURN p
revision: 3
resources: https://bloodhound.specterops.io/collect-data/sharphound-data-permissions#dc-registry
acknowledgements: Martin Sohn Christensen, @martinsohndk

