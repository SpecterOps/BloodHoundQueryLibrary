name: Accounts with weak password storage encryption
guid: 8bd6fcf2-3f3c-414c-857a-4caf28e49def
prebuilt: false
platforms: Active Directory
category: Active Directory Hygiene
description: Accounts whose password was set before the existence of Windows Server 2008 Domain Controllers, either explicitly or at account creation, and which therefore lack the AES encryption keys required for Kerberos authentication after RC4 disablement enforcement. The Windows Server 2008 release date is the earliest date AES keys can exist in any domain, so accounts in domains that promoted their first AES-capable Domain Controller later are not returned. The creation date of the Read-only Domain Controllers group provides the exact per-domain threshold.
query: |-
  MATCH (n:Base)
  // Password was set before AES keys could be generated
  WHERE (
    n.pwdlastset < 1204070400 // Windows Server 2008 release date
    AND NOT n.pwdlastset IN [-1.0, 0.0]
  )
  // Password was never reset since creation, and creation predates AES support
  OR (
    n.pwdlastset IN [-1.0, 0.0]
    AND n.whencreated < 1204070400 // Windows Server 2008 release date
    AND NOT n.whencreated IN [-1.0, 0.0]
  )
  RETURN n
  LIMIT 100
revision: 4
resources:
- https://techcommunity.microsoft.com/blog/coreinfrastructureandsecurityblog/decrypting-the-selection-of-supported-kerberos-encryption-types/1628797
