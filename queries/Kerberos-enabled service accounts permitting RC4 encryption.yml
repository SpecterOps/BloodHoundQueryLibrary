name: Kerberos-enabled service accounts permitting RC4 encryption
guid: cb8cf96e-21c9-422b-9439-390a13446ca6
prebuilt: false
platforms: Active Directory
category: Active Directory Hygiene
description: Service accounts with RC4 explicitly permitted in msDS-SupportedEncryptionTypes, which are therefore still issued RC4-encrypted service tickets after RC4 disablement enforcement and remain exposed to offline password recovery through Kerberoasting.
query: |-
  MATCH (n:Base)
  WHERE n.hasspn = true
  AND ANY(encryption_type IN n.supportedencryptiontypes WHERE encryption_type CONTAINS 'RC4') // RC4 explicitly permitted
  RETURN n
  LIMIT 100
revision: 3
resources:
