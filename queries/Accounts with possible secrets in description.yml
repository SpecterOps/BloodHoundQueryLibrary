name: Accounts with possible secrets in description
guid: b1c2fc7d-61fd-4047-81dc-42e75bea35b1
prebuilt: false
platforms:
- Active Directory
- Azure
category: Active Directory Hygiene
description: Users and computers whose description contains secret/password-related keywords. Broad match, so expect false positives.
query: |-
  MATCH (n)
  WHERE (n:User OR n:Computer)
    AND n.description IS NOT NULL
    AND n.description =~ '(?i).*(\\bpass(word|wd|phrase|code)?s?\\b|\\bpwd\\b|\\bpw\\b|p[@a]ssw[o0]rd|\\bcred(ential)?s?\\b|\\bsecret\\b|\\bpsk\\b|\\bpin\\b|temp(orary)?\\s?(pw|pass)|initial\\s?(pw|pass)|default\\s?(pw|pass)|reset\\s?to).*'
  RETURN n
  LIMIT 1000
revision: 1
