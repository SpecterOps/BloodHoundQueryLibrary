name: Computers with passwords older than the default maximum password age - MSSQL Failover Cluster
guid: 8fbb372e-f3fd-4fc8-a362-06d6315812c9
prebuilt: false
platforms: Active Directory
category: Active Directory Hygiene
description: Identifies enabled MSSQL failover cluster computer accounts whose password has not changed in the last 60 days and have logged on recently.
query: |-
  WITH 60 AS password_age_days
  MATCH (n:Computer)
  WHERE n.enabled = true
  AND n.whencreated < (datetime().epochseconds - (password_age_days * 86400))
  AND n.lastlogontimestamp > (datetime().epochseconds - (60 * 86400))
  AND n.lastlogon > (datetime().epochseconds - (60 * 86400))
  AND n.pwdlastset < (datetime().epochseconds - (password_age_days * 86400))
  AND ANY(spn IN n.serviceprincipalnames WHERE
    toLower(spn) CONTAINS 'mssqlservercluster' OR
    toLower(spn) CONTAINS 'mssqlserverclustermgmtapi' OR
    toLower(spn) CONTAINS 'msclustervirtualserver')
  RETURN n
  LIMIT 1000
revision: 1
resources:
- https://learn.microsoft.com/en-us/troubleshoot/windows-server/high-availability/troubleshoot-issues-accounts-used-failover-clusters#troubleshoot-password-issues-with-the-cluster-name-account
