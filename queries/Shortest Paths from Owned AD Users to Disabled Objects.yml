name: Shortest Paths from Owned AD Users to Disabled Objects
guid: 2f5d9c4a-7c8b-4e6a-a5f2-91d3b7e8c6aa
prebuilt: false
platforms: Active Directory
category: Shortest Paths
description: Finds the shortest attack paths from owned AD principals to disabled user or computer objects through common BloodHound attack edges.
query: |-
  MATCH p=shortestPath(
    (s:Base)-[
      :Owns|GenericAll|GenericWrite|WriteOwner|WriteDacl|MemberOf|ForceChangePassword|
      AllExtendedRights|AddMember|HasSession|GPLink|AllowedToDelegate|CoerceToTGT|
      AllowedToAct|AdminTo|CanPSRemote|CanRDP|ExecuteDCOM|HasSIDHistory|AddSelf|
      DCSync|ReadLAPSPassword|ReadGMSAPassword|DumpSMSAPassword|SQLAdmin|
      AddAllowedToAct|WriteSPN|AddKeyCredentialLink|SyncLAPSPassword|
      WriteAccountRestrictions|WriteGPLink|GoldenCert|ADCSESC1|ADCSESC3|
      ADCSESC4|ADCSESC6a|ADCSESC6b|ADCSESC9a|ADCSESC9b|ADCSESC10a|
      ADCSESC10b|ADCSESC13|SyncedToEntraUser|CoerceAndRelayNTLMToSMB|
      CoerceAndRelayNTLMToADCS|WriteOwnerLimitedRights|OwnsLimitedRights|
      ClaimSpecialIdentity|CoerceAndRelayNTLMToLDAP|CoerceAndRelayNTLMToLDAPS|
      ContainsIdentity|PropagatesACEsTo|GPOAppliesTo|CanApplyGPO|HasTrustKeys|
      ManageCA|ManageCertificates|Contains|DCFor|SameForestTrust|
      SpoofSIDHistory|AbuseTGTDelegation*1..
    ]->(t:Base)
  )
  WHERE s:Tag_Owned
    AND s <> t
    AND (t:User OR t:Computer)
    AND t.enabled = false
  RETURN p
  LIMIT 1000
