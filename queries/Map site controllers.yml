name: Map site controllers
guid: d7d7e8c6-971c-48ca-a77e-92228ed01402
prebuilt: true
platforms: Active Directory
category: AD Sites
description: Shows sites, their controllers, and the site-server or site-subnet objects they contain.
query: |-
  MATCH p = (:Base)-[:Owns|WriteOwner|WriteDacl|GenericAll|GenericWrite|WriteGPLink]->(:Site)-[:Contains]->(n:Base)
  WHERE n:SiteServer OR n:SiteSubnet
  RETURN p
  LIMIT 1000
